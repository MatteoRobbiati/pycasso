[project]
name = "matexxe"
version = "0.0.1"
description = "Automatic recolouring for images, PDFs and whole LaTeX papers"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Matteo Robbiati" }]
keywords = ["image", "pdf", "latex", "colour", "image-processing"]
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.22",
    "pikepdf>=8.0",
    "scipy>=1.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# only needed to regenerate the example plots in examples/paper_restyling/toy_paper/ --
# matexxe itself never needs matplotlib/seaborn to restyle an existing PDF or project
examples = ["matplotlib>=3.5", "seaborn>=0.12"]

[project.urls]
Homepage = "https://github.com/MatteoRobbiati/matexxe"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matexxe"]

[tool.hatch.build.targets.wheel.force-include]
"src/matexxe/palettes" = "matexxe/palettes"

[project]
name = "pycasso"
version = "0.0.1"
description = "Image processing with pillow"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Matteo Robbiati" }]
keywords = ["image", "pillow", "image-processing"]
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.22",
    "pikepdf>=8.0",
    "scipy>=1.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/MatteoRobbiati/pycasso"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycasso"]

[tool.hatch.build.targets.wheel.force-include]
"src/pycasso/palettes" = "pycasso/palettes"
